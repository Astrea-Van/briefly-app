<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briefly | AI Document Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans relative overflow-x-hidden selection:bg-zinc-800 selection:text-white">

    <!-- Auth Screen Container -->
    <div id="auth-screen" class="relative z-10 flex-1 flex items-center justify-center p-4 min-h-screen bg-zinc-950">
        <div class="w-full max-w-md bg-white rounded-3xl p-10 shadow-2xl space-y-8 relative text-zinc-900">
            
            <!-- Styled Brand Header replacing 'Welcome Back' -->
            <div class="text-center">
                <h2 id="auth-title" class="text-4xl font-extrabold tracking-tight select-none bg-clip-text text-transparent bg-gradient-to-br from-zinc-900 via-zinc-800 to-indigo-600 pb-2">
                    Briefly<span class="text-indigo-600 font-semibold">.io</span>
                </h2>
            </div>

            <form id="auth-form" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest block pl-1">Username</label>
                    <input type="text" id="username" required class="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 focus:border-zinc-400 rounded-xl text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none transition duration-200" placeholder="Enter username">
                </div>
                
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest block pl-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 focus:border-zinc-400 rounded-xl text-sm text-zinc-900 placeholder-zinc-400 focus:outline-none transition duration-200" placeholder="Enter your Password">
                </div>

                <button type="submit" id="auth-submit-btn" class="w-full py-3 bg-zinc-900 hover:bg-zinc-800 active:scale-[0.99] text-white font-semibold text-sm rounded-xl transition duration-150 shadow-md flex items-center justify-center gap-2">
                    Log In
                </button>
            </form>

            <div class="border-t border-zinc-100 pt-6 text-center">
                <button id="toggle-auth-btn" type="button" class="text-xs font-medium text-zinc-500 hover:text-zinc-800 transition">
                    Don't have an account? <span id="toggle-auth-action" class="text-indigo-600 underline underline-offset-4 font-semibold">Sign Up</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Dashboard Container -->
    <div id="dashboard-screen" class="hidden relative z-10 w-full h-screen flex flex-col overflow-hidden">
        <header class="bg-zinc-950 border-b border-zinc-900/80 px-6 py-4 flex justify-between items-center z-20 shrink-0">
            <h1 class="text-2xl font-extrabold tracking-tight select-none bg-clip-text text-transparent bg-gradient-to-r from-zinc-100 via-zinc-200 to-indigo-300">
                Briefly<span class="text-indigo-400 font-medium">.io</span>
            </h1>
            <div class="flex items-center gap-4">
                <span id="user-display" class="text-xs text-zinc-300 font-medium bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-lg"></span>
                <button id="logout-btn" class="px-3 py-1.5 bg-zinc-950 hover:bg-zinc-900 text-xs font-semibold text-zinc-400 hover:text-zinc-200 rounded-lg transition duration-150 border border-zinc-800">
                    Logout
                </button>
            </div>
        </header>

        <div class="flex flex-1 w-full overflow-hidden bg-zinc-950 items-stretch">
            <aside class="w-64 bg-zinc-900/60 border-r border-zinc-800/80 p-5 flex flex-col min-h-full overflow-hidden shadow-[4px_0_24px_rgba(0,0,0,0.3)] shrink-0 z-10">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-zinc-800/50 shrink-0">
                    <h2 class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">History Log</h2>
                </div>
                <div id="history-list" class="space-y-2 flex-1 overflow-y-auto pr-1 custom-scrollbar">
                    <p class="text-xs text-zinc-500 italic">No history recorded yet...</p>
                </div>
            </aside>

            <main class="flex-1 p-6 overflow-y-auto space-y-6 flex flex-col bg-zinc-950 custom-scrollbar">
                <div class="max-w-4xl mx-auto w-full space-y-6 flex flex-col flex-1">
                    <div class="bg-zinc-900/40 backdrop-blur-md rounded-xl p-6 border border-zinc-800/80 shadow-2xl space-y-4 shrink-0">
                        <h3 class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">Upload a new document</h3>
                        <form id="upload-form" class="space-y-4">
                            <div id="dropzone" class="border border-dashed border-zinc-800 hover:border-zinc-700/80 rounded-xl p-10 text-center cursor-pointer transition bg-zinc-950/40 hover:bg-zinc-900/30 group relative overflow-hidden flex flex-col items-center justify-center">
                                <input type="file" id="file-input" name="file" class="hidden" accept="image/*,application/pdf" />
                                <div class="space-y-2 flex flex-col items-center justify-center">
                                    <div class="w-10 h-10 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-center group-hover:border-indigo-500/50 group-hover:bg-zinc-950 transition duration-300">
                                        <svg class="w-5 h-5 text-zinc-400 group-hover:text-indigo-400 transition duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                    </div>
                                    <p class="text-sm font-medium text-zinc-300 group-hover:text-zinc-200 transition duration-200 pt-1">Click to upload or drag & drop</p>
                                    <p class="text-xs text-zinc-500">Supports PNG, JPEG, PDF up to 5MB</p>
                                </div>
                                <div id="file-selected-name" class="mt-4 text-xs font-semibold px-3 py-1 bg-emerald-950/30 border border-emerald-900/50 text-emerald-400 rounded-full hidden"></div>
                            </div>
                            <div class="flex items-center gap-4 w-full pt-1">
                                <button type="submit" id="submit-btn" class="w-1/2 py-2.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold text-sm rounded-lg transition shadow-md truncate tracking-wide">Analyze Document with Gemini</button>
                                <button type="button" id="new-analysis-btn" class="w-1/2 py-2.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-400 hover:text-zinc-200 font-semibold text-sm rounded-lg transition shadow-sm truncate">Clear Window</button>
                            </div>
                        </form>
                    </div>
                    <div id="loading-spinner" class="hidden flex flex-col items-center justify-center py-12 space-y-4 bg-zinc-900/40 border border-zinc-800/60 rounded-xl shrink-0">
                        <div class="relative w-9 h-9"><div class="animate-spin rounded-full h-9 w-9 border-2 border-indigo-500/20 border-t-indigo-400"></div></div>
                        <p class="text-zinc-400 text-xs font-semibold tracking-wider uppercase animate-pulse">Analyzing document...</p>
                    </div>
                    <div id="result-box" class="hidden bg-zinc-900/40 backdrop-blur-md rounded-xl p-6 border border-zinc-800/80 shadow-2xl flex-1 flex flex-col min-h-0">
                        <div class="border-b border-zinc-800/60 pb-3.5 mb-4 flex justify-between items-center shrink-0">
                            <h2 class="text-md font-semibold text-zinc-100 tracking-tight flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Analysis Details
                            </h2>
                            <span id="result-filename" class="text-[10px] bg-zinc-950 border border-zinc-800 text-zinc-400 px-3 py-1 rounded-full font-mono font-bold tracking-wider"></span>
                        </div>
                        <div id="analysis-content" class="prose prose-invert max-w-none text-zinc-300 space-y-3 leading-relaxed text-sm overflow-y-auto flex-1 pr-2 custom-scrollbar break-words"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Script Engine -->
    <script>
        let authScreen, dashboardScreen, authTitle, authForm, usernameInput, passwordInput, authSubmitBtn, userDisplay, logoutBtn;
        let dropzone, fileInput, fileSelectedName, uploadForm, submitBtn, loadingSpinner, resultBox, resultFilename, analysisContent, historyList, newAnalysisBtn;
        let toggleAuthBtn, toggleAuthAction;
        
        let isLoginMode = true;

        document.addEventListener('DOMContentLoaded', () => {
            authScreen = document.getElementById('auth-screen');
            dashboardScreen = document.getElementById('dashboard-screen');
            authTitle = document.getElementById('auth-title');
            authForm = document.getElementById('auth-form');
            usernameInput = document.getElementById('username');
            passwordInput = document.getElementById('password');
            authSubmitBtn = document.getElementById('auth-submit-btn');
            userDisplay = document.getElementById('user-display');
            logoutBtn = document.getElementById('logout-btn');

            toggleAuthBtn = document.getElementById('toggle-auth-btn');
            toggleAuthAction = document.getElementById('toggle-auth-action');

            dropzone = document.getElementById('dropzone');
            fileInput = document.getElementById('file-input');
            fileSelectedName = document.getElementById('file-selected-name');
            uploadForm = document.getElementById('upload-form');
            submitBtn = document.getElementById('submit-btn');
            loadingSpinner = document.getElementById('loading-spinner');
            resultBox = document.getElementById('result-box');
            resultFilename = document.getElementById('result-filename');
            analysisContent = document.getElementById('analysis-content');
            historyList = document.getElementById('history-list');
            newAnalysisBtn = document.getElementById('new-analysis-btn');

            setupEventListeners();
            checkSession();
        });

        function setupEventListeners() {
            toggleAuthBtn.addEventListener('click', () => {
                isLoginMode = !isLoginMode;
                if (isLoginMode) {
                    authSubmitBtn.textContent = "Log In";
                    toggleAuthBtn.innerHTML = `Don't have an account? <span id="toggle-auth-action" class="text-indigo-600 underline underline-offset-4 font-semibold">Sign Up</span>`;
                } else {
                    authSubmitBtn.textContent = "Sign Up";
                    toggleAuthBtn.innerHTML = `Already have an account? <span id="toggle-auth-action" class="text-indigo-600 underline underline-offset-4 font-semibold">Log In</span>`;
                }
            });

            authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = usernameInput.value;
                const password = passwordInput.value;
                const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/signup';

                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await response.json();

                    if (data.success) {
                        if (isLoginMode) {
                            showDashboard(data.user);
                        } else {
                            alert("Account created successfully! You can now log in.");
                            isLoginMode = true;
                            toggleAuthBtn.click();
                        }
                        authForm.reset();
                    } else {
                        alert(data.error || "Authentication failed.");
                    }
                } catch (err) {
                    console.error("Auth error:", err);
                    alert("An error occurred during authentication.");
                }
            });

            logoutBtn.addEventListener('click', async () => {
                try {
                    const res = await fetch('/api/auth/logout', { method: 'POST' });
                    const data = await res.json();
                    if (data.success) showAuthScreen();
                } catch (err) { console.error(err); }
            });

            newAnalysisBtn.addEventListener('click', () => {
                uploadForm.reset();
                fileSelectedName.classList.add('hidden');
                resultBox.classList.add('hidden');
                loadHistory(); 
            });

            dropzone.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', () => {
                if (fileInput.files && fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const MAX_SIZE = 5 * 1024 * 1024;
                    const allowedTypes = ['image/png', 'image/jpeg', 'image/jpg', 'application/pdf'];

                    if (!allowedTypes.includes(file.type)) {
                        alert("Incompatible type entered, enter a compatible file.");
                        uploadForm.reset();
                        fileSelectedName.classList.add('hidden');
                        return;
                    }

                    if (file.size > MAX_SIZE) {
                        alert("Memory limit exceeded, enter a compatible file.");
                        uploadForm.reset();
                        fileSelectedName.classList.add('hidden');
                        return;
                    }

                    fileSelectedName.textContent = `Selected: ${file.name} (${(file.size/1024).toFixed(1)} KB)`;
                    fileSelectedName.classList.remove('hidden');
                    injectOptimisticHistoryEntry(file.name, file.type);
                } else {
                    fileSelectedName.classList.add('hidden');
                }
            });

            ['dragenter', 'dragover'].forEach(eventName => {
                dropzone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropzone.classList.add('border-indigo-500/50', 'bg-zinc-900/30');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropzone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropzone.classList.remove('border-indigo-500/50', 'bg-zinc-900/30');
                }, false);
            });

            dropzone.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                if(files && files.length > 0) {
                    fileInput.files = files;
                    fileInput.dispatchEvent(new Event('change'));
                }
            });

            uploadForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!fileInput.files || fileInput.files.length === 0) {
                    alert("No file entered. Please enter a file for analysis.");
                    return;
                }
                
                submitBtn.disabled = true;
                submitBtn.textContent = "Analyzing...";
                loadingSpinner.classList.remove('hidden');
                resultBox.classList.add('hidden');
                
                const formData = new FormData();
                formData.append('file', fileInput.files[0]); 
                
                try {
                    const response = await fetch('/api/analyze/document', { method: 'POST', body: formData });
                    const data = await response.json();
                    if (data.success) {
                        displayResult(data.file.name, data.analysis);
                        loadHistory();
                        uploadForm.reset();
                        fileSelectedName.classList.add('hidden');
                    } else { 
                        const pending = document.getElementById('pending-entry');
                        if (pending) pending.remove();
                        alert(data.error || "Analysis Failed."); 
                    }
                } catch (error) { 
                    const pending = document.getElementById('pending-entry');
                    if (pending) pending.remove();
                    console.error(error); 
                    alert("An interface communications error occurred."); 
                } finally { 
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Analyze Document with Gemini";
                    loadingSpinner.classList.add('hidden'); 
                }
            });
        }

        function showAuthScreen() {
            dashboardScreen.classList.add('hidden');
            authScreen.classList.remove('hidden');
            historyList.innerHTML = '<p class="text-xs text-zinc-500 italic">No history recorded yet...</p>';
            resultBox.classList.add('hidden');
        }

        function showDashboard(user) {
            authScreen.classList.add('hidden');
            dashboardScreen.classList.remove('hidden');
            userDisplay.textContent = `👋 Hello, ${user.username}`;
            loadHistory();
        }

        async function checkSession() {
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();
                if (data.loggedIn) showDashboard(data.user); else showAuthScreen();
            } catch (err) { showAuthScreen(); }
        }

        function injectOptimisticHistoryEntry(filename, fileType) {
            const emptyState = historyList.querySelector('p.italic');
            if (emptyState) emptyState.remove();
            const cleanType = fileType.includes('/') ? fileType.split('/')[1].toUpperCase() : "DOC";
            
            const btn = document.createElement('button');
            btn.id = "pending-entry";
            btn.type = "button";
            btn.className = "p-2.5 bg-indigo-950/20 border border-indigo-900/30 rounded-lg text-left w-full block select-none cursor-not-allowed animate-pulse";
            btn.innerHTML = `<div class="text-xs font-medium text-indigo-300 truncate">${filename}</div><div class="text-[10px] text-indigo-400/60 mt-1 flex justify-between items-center w-full"><span>${cleanType}</span><span>Ready to Analyze...</span></div>`;
            historyList.insertBefore(btn, historyList.firstChild);
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/analyze/history');
                const result = await response.json();
                if (result.success) {
                    historyList.innerHTML = '';
                    if (!result.data || result.data.length === 0) { historyList.innerHTML = '<p class="text-xs text-zinc-500 italic">No history recorded yet...</p>'; return; }
                    result.data.forEach(item => {
                        const timestamp = item.created_at || item.timestamp || new Date();
                        const date = new Date(timestamp).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
                        const nameOfFile = item.filename || "Document";
                        const rawType = item.mimetype || "application/octet-stream";
                        const cleanType = rawType.includes('/') ? rawType.split('/')[1].toUpperCase() : rawType.toUpperCase();
                        const analysisText = item.analysis || "";
                        
                        const btn = document.createElement('button');
                        btn.type = "button";
                        btn.className = "p-2.5 bg-zinc-950/40 hover:bg-zinc-900/60 border-l-2 border-l-transparent hover:border-l-indigo-500 border border-zinc-900/60 hover:border-zinc-800 rounded-r-lg cursor-pointer transition shadow-sm group text-left w-full block select-none";
                        btn.innerHTML = `<div class="text-xs font-medium text-zinc-400 truncate group-hover:text-zinc-200">${nameOfFile}</div><div class="text-[10px] text-zinc-500 group-hover:text-zinc-400 mt-1 flex justify-between items-center w-full"><span>${cleanType}</span><span>${date}</span></div>`;
                        btn.addEventListener('click', (e) => { e.preventDefault(); displayResult(nameOfFile, analysisText); });
                        historyList.appendChild(btn);
                    });
                }
            } catch (err) { console.error("Failed to load user history:", err); }
        }

        function displayResult(filename, mdText) {
            resultFilename.textContent = filename;
            analysisContent.innerHTML = marked.parse(mdText || "*No record analysis details found.*");
            resultBox.classList.remove('hidden');
            resultBox.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
